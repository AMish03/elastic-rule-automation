name: Enforce Branch Naming Convention
on:
  create:
    branches:
      - '*'

jobs:
  enforce-branch-name:
    runs-on: ubuntu-latest
    # You MUST still define permissions for the token to work
    permissions:
      contents: write 
      
    steps:
      - name: Initialize dummy git repo
        run: git init # Needed to run subsequent git commands

      - name: Check branch name and delete if invalid
        env:
          BRANCH_REF: ${{ github.ref }}
          # The GITHUB_TOKEN is automatically available
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          PATTERN='^refs/heads/feature/AB#[0-9]+$'
          
          if [[ ! "$BRANCH_REF" =~ $PATTERN ]]; then
            BRANCH_NAME="${BRANCH_REF#refs/heads/}"
            echo "Attempting to delete remote branch: $BRANCH_NAME"
            
            # --- The critical fix is here ---
            REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            
            # Delete the branch using the token in the URL
            git push "$REMOTE_URL" --delete "$BRANCH_NAME"
            
            exit 1
          else
            echo "Branch name is valid: $BRANCH_REF"
          fi
